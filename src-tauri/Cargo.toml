[package]
name = "Bellwake"
version = "0.1.0"
description = "Агент доставки уведомлений Bellwake"
authors = ["Ivan Ovsyannikov"]
edition = "2021"

# Описание полей: https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Суффикс `_lib` сохраняет уникальность имени библиотеки и не даёт ему
# пересечься с именем исполняемого файла. Это особенно важно в Windows:
# https://github.com/rust-lang/cargo/issues/8519
name = "bellwake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
machine-uid = "0.6.0"
whoami = "2.1.3"
reqwest = { version = "0.13.5", features = ["json"] }
keyring = "4.2.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["time"] }
rumqttc = "0.25.1"


# Рекомендации по оптимизации размера: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
